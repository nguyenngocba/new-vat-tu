<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Test Dấu Phẩy</title>
<style>body{font-family:sans-serif;padding:30px;background:#1a1a2e;color:white}input{padding:12px;font-size:18px;width:400px;border-radius:8px;border:2px solid #378ADD;background:#16213e;color:white}.info{margin-top:20px;padding:15px;background:#0f3460;border-radius:8px}.ok{color:#97C459}</style>
</head>
<body>
<h2>Test Input Số - CHUẨN</h2>
<input type="text" id="t" value="0" autocomplete="off" placeholder="Gõ số...">
<div class="info">
    <strong>Hiển thị:</strong> <span id="r" class="ok">0</span><br>
    <strong>Giá trị thực:</strong> <span id="n">0</span><br>
    <strong>Debug:</strong> <span id="d"></span>
</div>
<button onclick="test('1111111')">1111111</button>
<button onclick="test('1111111,5')">1111111,5</button>
<button onclick="test('1234,56')">1234,56</button>
<button onclick="test('9999')">9999</button>
<button onclick="test('9999,')">9999,</button>

<script>
function f(v){
    if(!v||v==='')return'';
    let neg=v.startsWith('-');
    if(neg)v=v.substring(1);
    
    // CHỈ giữ số và dấu ,
    v=v.replace(/[^\d,]/g,'');
    if(!v)return neg?'-':'';
    
    // Tìm dấu , ĐẦU TIÊN -> đó là dấu thập phân
    let fi=v.indexOf(',');
    let ip='', dp='';
    if(fi>=0){
        ip=v.substring(0,fi);
        dp=v.substring(fi+1).replace(/,/g,''); // bỏ dấu , thừa trong phần thập phân
    }else{
        ip=v;
        dp='';
    }
    
    document.getElementById('d').textContent='ip='+ip+' dp='+dp;
    
    ip=ip.replace(/^0+/,'')||'0';
    // Format phần nguyên: thêm . mỗi 3 số
    let fi2='',c=0;
    for(let i=ip.length-1;i>=0;i--){
        fi2=ip[i]+fi2;c++;
        if(c%3===0&&i>0)fi2='.'+fi2;
    }
    
    let r=fi2;
    if(fi>=0)r+=','+dp; // giữ dấu , ngay cả khi dp rỗng (đang gõ dở)
    if(neg)r='-'+r;
    return r;
}

const i=document.getElementById('t'),rw=document.getElementById('r'),n=document.getElementById('n');
i.addEventListener('input',function(){
    let v=this.value,oc=this.selectionStart,ft=f(v),ol=this.value.length,nl=ft.length;
    this.value=ft;
    let nc=oc+(nl-ol);if(nc>nl)nc=nl;if(nc<0)nc=0;this.setSelectionRange(nc,nc);
    rw.textContent=ft;
    n.textContent=parseFloat(ft.replace(/\./g,'').replace(',','.'))||0;
});
function test(val){document.getElementById('t').value=val;document.getElementById('t').dispatchEvent(new Event('input'));}
</script>
</body>
</html>
